<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio</title>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0 0 24px 0;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 20px;
            font-family: inherit;
        }
        button {
            width: 100%;
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>AI Video Studio</h1>
    <p>Powered by Google Colab T4 GPU & ModelScope</p>
    
    <label for="videoPrompt">VIDEO PROMPT</label>
    <textarea id="videoPrompt" placeholder="e.g., A cinematic shot of a cybernetic tiger walking in a neon city..."></textarea>
    
    <button id="generateBtn" onclick="generateVideo()">Generate AI Video</button>
</div>

<script>
    // Your active Google Colab ngrok backend URL
    const BACKEND_URL = "https://enjoying-playing-amused.ngrok-free.dev"; 

    async function generateVideo() {
        const promptInput = document.getElementById("videoPrompt");
        const promptText = promptInput.value.trim();

        if (!promptText) {
            alert("Please type a video prompt first!");
            return;
        }

        const btn = document.getElementById("generateBtn");
        btn.innerText = "Generating...";
        btn.disabled = true;

        try {
            const response = await fetch(`${BACKEND_URL}/generate`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "true"
                },
                body: JSON.stringify({ prompt: promptText })
            });

            if (!response.ok) {
                throw new Error(`Server error: ${response.status}`);
            }

            const data = await response.json();
            console.log("Success:", data);
            alert("Response from Colab: " + (data.message || "Video generation started!"));

        } catch (error) {
            console.error("Connection failed:", error);
            alert("Failed to connect to the Colab backend. Make sure your Colab notebook is running!");
        } finally {
            btn.innerText = "Generate AI Video";
            btn.disabled = false;
        }
    }
</script>

</body>
  </html>
