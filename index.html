<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio</title>
    <style>
        body {
            background-color: #0b1120;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0 0 24px 0;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            padding: 12px;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 20px;
            font-family: inherit;
        }
        button {
            width: 100%;
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>AI Video Studio</h1>
    <p>Powered by Google Colab T4 GPU & ModelScope</p>
    
    <label for="videoPrompt">VIDEO PROMPT</label>
    <textarea id="videoPrompt" placeholder="e.g., A cinematic shot of a cybernetic tiger walking in a neon city..."></textarea>
    
    <button id="generateBtn" onclick="generateVideo()">Generate AI Video</button>
</div>

<!-- This links your script.js file so the button works -->
<script src="script.js"></script>

</body>
</html>
